# Motor + LED node on mps2/an521/cpu0/ns: Zephyr in the non-secure world,
# TF-M (PSA Crypto, Internal Trusted Storage) in the secure world.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PARTITION_CRYPTO=y
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_ZVFS_OPEN_MAX=8

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_PRINTK=y

# QEMU user-mode networking on the LAN9118 model (no SLIP / UART pipe)
CONFIG_NET_QEMU_USER=y
CONFIG_UART_PIPE=n
CONFIG_ENTROPY_GENERATOR=y
# 1 ms kernel tick so the 1 kHz control loop really runs at 1 kHz
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
